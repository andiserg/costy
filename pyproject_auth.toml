[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "auth"
version = "0.1.0"
dependencies = [
    'sqlalchemy',
    "litestar",
    'uvicorn',
    'psycopg[binary]',
    'alembic',
    'adaptix',
    'httpx',
    'python-jose',
    'prometheus-client',
    "dishka",
]
