[project]
name = "costy"
version = "0.1.0"
dependencies = [
    'sqlalchemy',
    "litestar",
    'uvicorn',
    'psycopg[binary]',
    'alembic',
    'adaptix',
    'aiohttp',
    'python-jose',
    'prometheus-client',
    "dishka",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/costy"]

[project.optional-dependencies]
ci = [
    'pytest',
    'pytest-asyncio',
    'pytest-cov',
    'pre-commit',
]

dev = [
    'costy[ci]',
    'pytest-env',
    'ruff',
    'isort',
    'mypy',
    'flake8',
    'bandit'
]

[tool.setuptools.package-data]
costy = [
    "adapters/bankapi/_banks.json",
    "adapters/bankapi/_mcc.json",
    "infrastructure/db/_default_categories.json"
]
